baseURL = "https://zzzzzy2k.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "zzzzzy2k 的博客"
theme = "stack"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 5

[outputs]
  page = ["HTML", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  suffix = "json"
  isPlainText = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
