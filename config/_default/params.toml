mainSections = ["posts"]
defaultTheme = "auto"
robots = true

[sidebar]
  emoji = "📖"
  subtitle = "记录技术与生活"
  avatar = "images/avatar.png"
  [sidebar.posts]
    limit = 5

[article]
  toc = true
  readingTime = true
  license = { enabled = false }

[widget]
  [widget.social]
    enabled = true

[[widgets.homepage]]
  type = "search"

[[widgets.homepage]]
  type = "categories"
  [widgets.homepage.params]
    limit = 8

[[widgets.homepage]]
  type = "tag-cloud"
  [widgets.homepage.params]
    limit = 10

[[widgets.homepage]]
  type = "archives"
  [widgets.homepage.params]
    limit = 5

[[widgets.homepage]]
  type = "toc"

[footer]
  since = 2026

[comments]
  enabled = false

[readingTime]
  enabled = true

[seo]
  [seo.title]
    separator = " - "
