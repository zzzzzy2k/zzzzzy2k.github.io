mainSections = ["posts"]
rssFullContent = true

SortBy = "default"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "📖"
    subtitle = "记录技术与生活"
    avatar   = "/images/avatar.png"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true
    toc           = true

    [article.license]
        enabled = false

    [article.list]
        showTags = true

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled = false
